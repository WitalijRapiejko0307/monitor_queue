[project]
name = "queue-monitor-bot"
version = "0.1.0"
description = "Telegram bot: paid one-time alert when queue at a BY border crossing point forms"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4.0",
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<0.30",
    "httpx>=0.27,<0.28",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<6.0",
    "APScheduler>=3.10,<4.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "ruff>=0.6,<0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
